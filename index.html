<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>creative coding</title>
  <style>
    :root {
      --bg: #080808;
      --surface: #111;
      --border: #1e1e1e;
      --border-hover: #333;
      --text: #d4d4d4;
      --muted: #555;
      --accent: #c8f;
      --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    header {
      max-width: 960px;
      margin: 0 auto 3rem;
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: var(--accent);
    }

    .meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .card {
      background: var(--bg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
      position: relative;
    }

    .card:hover {
      background: var(--surface);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .week {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .type-badge {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      padding: 0.2em 0.5em;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .type-p5    { background: #1a2a1a; color: #6f6; }
    .type-three { background: #1a1a2a; color: #66f; }
    .type-webgpu{ background: #2a1a1a; color: #f96; }
    .type-vanilla { background: #1e1e1e; color: #aaa; }

    .card-title {
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .card-date {
      font-size: 0.65rem;
      color: var(--border-hover);
    }

    .arrow {
      position: absolute;
      bottom: 1.25rem;
      right: 1.25rem;
      font-size: 0.75rem;
      color: var(--border-hover);
      transition: color 0.15s, transform 0.15s;
    }

    .card:hover .arrow {
      color: var(--accent);
      transform: translate(2px, -2px);
    }

    .empty {
      max-width: 960px;
      margin: 4rem auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 2;
    }

    .empty code {
      color: var(--accent);
      background: var(--surface);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1>creative coding</h1>
    <span class="meta" id="count"></span>
  </header>

  <main id="main"></main>

  <script>
    const TYPE_LABELS = { p5: 'p5.js', three: 'three.js', webgpu: 'WebGPU', vanilla: 'canvas' };

    async function render() {
      const res = await fetch('./projects.json');
      const { projects } = await res.json();
      const main = document.getElementById('main');

      document.getElementById('count').textContent =
        projects.length === 0 ? '' :
        `${projects.length} sketch${projects.length !== 1 ? 'es' : ''}`;

      if (projects.length === 0) {
        main.innerHTML = `<div class="empty">
          <p>no sketches yet</p>
          <p>run <code>./scripts/new.sh "title" [p5|three|webgpu|vanilla]</code> to start</p>
        </div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';

      for (const p of projects) {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = `./projects/${p.slug}/`;
        a.innerHTML = `
          <div class="card-top">
            <span class="week">${p.week}</span>
            <span class="type-badge type-${p.type}">${TYPE_LABELS[p.type] ?? p.type}</span>
          </div>
          <div class="card-title">${p.title}</div>
          ${p.description ? `<div class="card-desc">${p.description}</div>` : ''}
          <div class="card-date">${p.date}</div>
          <span class="arrow">↗</span>
        `;
        grid.appendChild(a);
      }

      main.appendChild(grid);
    }

    render().catch(err => {
      document.getElementById('main').innerHTML =
        `<div class="empty"><p>could not load projects.json</p><p>run <code>npm start</code> to serve locally</p></div>`;
    });
  </script>
</body>
</html>
