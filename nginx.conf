server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS, WGSL, and JSON must always be re-validated — never serve stale code
    location ~* \.(js|wgsl|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else (HTML, CSS, images) can be cached normally
    location / {
        try_files $uri $uri/ =404;
    }
}
