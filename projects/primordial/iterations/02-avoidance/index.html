<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 12px;
      }
      canvas {
        border: 1px solid #333;
      }
      #controls {
        display: flex;
        gap: 8px;
      }
      button {
        font-family: monospace;
        font-size: 12px;
        padding: 4px 12px;
        background: #222;
        color: #aaa;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
      }
      button[data-active="1"] {
        background: #1a3a1a;
        color: #4f4;
        border-color: #4f4;
      }
      label {
        font-family: monospace;
        font-size: 11px;
        color: #888;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        width: 120px;
        height: 2px;
        background: #444;
        outline: none;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        background: #aaa;
        border-radius: 50%;
        cursor: pointer;
      }
      .val {
        color: #ccc;
        min-width: 2.5em;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="mode-toggle" data-active="0">Drift</button>
      <label>radius <input type="range" id="radius-slider" min="2" max="80" step="1" value="10"> <span class="val" id="radius-val">10</span></label>
      <label>blend <input type="range" id="blend-slider" min="0.01" max="0.5" step="0.01" value="0.08"> <span class="val" id="blend-val">0.08</span></label>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
