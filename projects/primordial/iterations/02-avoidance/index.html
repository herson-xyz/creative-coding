<html>
  <head>
    <style>
      body {
        margin: 0;
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 12px;
      }
      canvas {
        border: 1px solid #333;
      }
      #controls {
        display: flex;
        gap: 8px;
      }
      button {
        font-family: monospace;
        font-size: 12px;
        padding: 4px 12px;
        background: #222;
        color: #aaa;
        border: 1px solid #444;
        border-radius: 4px;
        cursor: pointer;
      }
      button[data-active="1"] {
        background: #1a3a1a;
        color: #4f4;
        border-color: #4f4;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="mode-toggle" data-active="0">Drift</button>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
